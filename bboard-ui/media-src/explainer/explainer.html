<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VeilCore Explainer</title>
<style>
@font-face{font-family:'Space Grotesk';font-weight:400;src:url(fonts/space-grotesk-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Space Grotesk';font-weight:500;src:url(fonts/space-grotesk-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Space Grotesk';font-weight:600;src:url(fonts/space-grotesk-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Space Grotesk';font-weight:700;src:url(fonts/space-grotesk-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:400;src:url(fonts/inter-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:500;src:url(fonts/inter-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:600;src:url(fonts/inter-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:700;src:url(fonts/inter-latin-700-normal.woff2) format('woff2')}
:root{--bg:#F5F6F2;--card:#FFFFFF;--line:#DADFD8;--ink:#16201B;--ink2:#4A564F;--muted:#7C8780;--acc:#00785A;--accsoft:#E6F2EC;--send:#0060A0;--sendsoft:#E5EFF7;--prove:#A84300;--lic:#9C3F78;--well:#F1F3EF}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.grp,.abs,.card{position:absolute}
.grp{left:0;top:0;width:1920px;height:1080px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(22,32,27,.04),0 8px 24px rgba(22,32,27,.045)}
.sg{font-family:'Space Grotesk',sans-serif}
.eyebrow{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}
.row{display:flex;align-items:center}
.h2{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:28px;letter-spacing:-.01em;color:var(--ink)}
.sub{font-size:17px;color:var(--ink2)}
.hex{font-family:'Space Grotesk',sans-serif;font-weight:500;font-feature-settings:"tnum" 1;letter-spacing:.02em;white-space:pre}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:6px 14px;font-family:'Space Grotesk',sans-serif;font-weight:600}
.cap{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;text-align:center}
.cap .main{font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:50px;line-height:1.2;letter-spacing:-.012em;color:var(--ink);max-width:1540px}
.cap .note{font-family:'Inter',sans-serif;font-size:30px;color:#66726B;margin-top:16px}
.tg{position:absolute;width:68px;height:38px;border-radius:19px;background:#C9CFC8}
.tg .k{position:absolute;left:4px;top:4px;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.18)}
.slot{position:absolute;border:2px dashed #C6CEC5;border-radius:12px}
.chip{position:absolute;left:0;top:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 4px rgba(22,32,27,.06),0 10px 28px rgba(22,32,27,.08)}
svg.lines{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible}
</style>
</head>
<body>
<div id="root"></div>
<script>
// ---------- helpers ----------
const C={bg:'#F5F6F2',line:'#DADFD8',ink:'#16201B',ink2:'#4A564F',muted:'#7C8780',acc:'#00785A',accsoft:'#E6F2EC',send:'#0060A0',sendsoft:'#E5EFF7',prove:'#A84300',well:'#F1F3EF'};
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lin=x=>x;
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eout=x=>1-Math.pow(1-x,3);
const ein=x=>x*x*x;
const P=(t,a,b,e=eio)=>e(clamp((t-a)/(b-a)));
const lerp=(a,b,k)=>a+(b-a)*k;
const $=id=>document.getElementById(id);
const hash=n=>{n=(n^61)^(n>>>16);n=Math.imul(n,9);n=n^(n>>>4);n=Math.imul(n,0x27d4eb2d);n=n^(n>>>15);return n>>>0;};
function hexRGB(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function mix(a,b,k){const A=hexRGB(a),B=hexRGB(b);return `rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],k))).join(',')})`;}
function st(el,o){
  if(typeof el==='string') el=$(el);
  if(!el) return;
  const x=o.x||0,y=o.y||0,s=o.s==null?1:o.s;
  el.style.transform=`translate(${x.toFixed(2)}px,${y.toFixed(2)}px) scale(${s.toFixed(4)})`+(o.r?` rotate(${o.r}deg)`:'');
  if(o.o!=null){el.style.opacity=o.o.toFixed(3);el.style.visibility=o.o<=0.001?'hidden':'visible';}
}
// fade+rise in
function ap(el,t,t0,d=0.55,dy=14,extra={}){const k=P(t,t0,t0+d,eout);st(el,Object.assign({o:k,y:(1-k)*dy},extra));return k;}

// ---------- icons ----------
const PATHS={
 sprout:'<path d="M12 21v-9"/><path d="M12 13C12 9 9 6.5 4.5 6.5 4.5 10.5 7.5 13 12 13z"/><path d="M12 11c0-3.8 2.6-6.5 7-6.5 0 4-2.8 6.5-7 6.5z"/>',
 lock:'<rect x="5" y="10.5" width="14" height="10.5" rx="2.2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>',
 unlock:'<rect x="5" y="10.5" width="14" height="10.5" rx="2.2"/><path d="M8 10.5V7.5a4 4 0 0 1 7.6-1.7"/>',
 check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
 person:'<circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c0-4.2 3.4-6.8 7.5-6.8s7.5 2.6 7.5 6.8"/>',
 laptop:'<rect x="4" y="5" width="16" height="11" rx="1.6"/><path d="M2 19.5h20"/>',
 flask:'<path d="M9 3h6"/><path d="M10 3v6.2L4.6 18.8A1.6 1.6 0 0 0 6 21.2h12a1.6 1.6 0 0 0 1.4-2.4L14 9.2V3"/><path d="M7.2 15h9.6"/>',
 tube:'<path d="M8.5 3h7"/><path d="M10 3v14.5a2 2 0 0 0 4 0V3"/><path d="M10 11h4"/>',
 link:'<path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"/><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/>',
 doc:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/>',
 mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 7l8.5 6 8.5-6"/>',
 strike:'<path d="M3 3l18 18"/>',
 cal:'<rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
 seal:'<circle cx="12" cy="9" r="6"/><path d="M9.2 14.3L8 21l4-2 4 2-1.2-6.7"/>',
 ledger:'<rect x="3.5" y="4" width="17" height="4.5" rx="1.2"/><rect x="3.5" y="10" width="17" height="4.5" rx="1.2"/><rect x="3.5" y="16" width="17" height="4.5" rx="1.2"/>',
 cloud:'<path d="M7 18.5h10.5a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.6 9.6 4.5 4.5 0 0 0 7 18.5z"/>',
 eyeoff:'<path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6 0 9.5 7 9.5 7a17 17 0 0 1-2.6 3.4M6.6 6.6C3.9 8.4 2.5 12 2.5 12s3.5 7 9.5 7a9 9 0 0 0 4.4-1.1"/>',
 arrowR:'<path d="M5 12h14M13 6l6 6-6 6"/>'
};
function ic(n,s,c,w=1.8){return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" style="flex:none;display:block">${PATHS[n]}</svg>`;}
function fpGlyph(s,c,cls='fr'){
  const R=[[9,'44 12.5',30],[14,'50 9 20 9',200],[19,'64 10 36 9.4',110],[24,'80 11 50 9.8',290],[29,'100 12 58 12.2',20]];
  let o=`<svg width="${s}" height="${s}" viewBox="0 0 64 64" fill="none" stroke="${c}" stroke-width="2.6" stroke-linecap="round" style="flex:none;display:block;overflow:visible"><circle class="${cls}" cx="32" cy="32" r="3" fill="${c}" stroke="none"/>`;
  R.forEach(([r,d,rot])=>{o+=`<circle class="${cls}" cx="32" cy="32" r="${r}" stroke-dasharray="${d}" transform="rotate(${rot} 32 32)"/>`;});
  return o+'</svg>';
}
function chk(s,bg=C.acc){return `<div style="flex:none;width:${s}px;height:${s}px;border-radius:50%;background:${bg};display:flex;align-items:center;justify-content:center">${ic('check',Math.round(s*.62),'#fff',2.8)}</div>`;}
function iconTile(n,s,c,bg){return `<div style="flex:none;width:${s}px;height:${s}px;border-radius:10px;background:${bg};display:flex;align-items:center;justify-content:center">${ic(n,Math.round(s*.56),c,1.9)}</div>`;}
function markerStrip(n=30,seed=7){let o='<div class="row" style="align-items:flex-end;gap:3px;height:28px">';const cols=['#00785A','#6FAE97','#BFD6CB','#2F8F72'];for(let i=0;i<n;i++){const h=8+hash(i*31+seed)%21;o+=`<div style="width:5px;height:${h}px;border-radius:1.5px;background:${cols[hash(i*7+seed)%4]}"></div>`;}return o+'</div>';}
function lineSVG(id,x1,y1,x2,y2,head=true,color='#AEB8B0'){
  const ang=Math.atan2(y2-y1,x2-x1),a=10;
  const hx1=x2-a*Math.cos(ang-0.5),hy1=y2-a*Math.sin(ang-0.5),hx2=x2-a*Math.cos(ang+0.5),hy2=y2-a*Math.sin(ang+0.5);
  return `<g id="${id}"><path class="ln" d="M${x1} ${y1}L${x2} ${y2}" pathLength="1" stroke="${color}" stroke-width="2" stroke-linecap="round" fill="none" stroke-dasharray="1 1" stroke-dashoffset="1"/>`+
   (head?`<path class="hd" d="M${hx1.toFixed(1)} ${hy1.toFixed(1)}L${x2} ${y2}L${hx2.toFixed(1)} ${hy2.toFixed(1)}" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0"/>`:'')+'</g>';
}
function drawLine(id,k){const g=$(id);if(!g)return;g.querySelector('.ln').setAttribute('stroke-dashoffset',(1-k).toFixed(4));const h=g.querySelector('.hd');if(h)h.setAttribute('opacity',clamp((k-0.94)/0.06).toFixed(3));}
const CURSOR=`<svg width="34" height="40" viewBox="0 0 34 40" style="display:block;overflow:visible"><path d="M3 2 L3 30 L10.5 23.5 L15.5 35 L20.5 32.8 L15.6 21.6 L25.5 21.2 Z" fill="#16201B" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/></svg>`;
const HEX='d637 717f 2249 f6a1 4592 24dc';
function scramble(t,t0,per=0.032,settle=0.3){let o='';for(let i=0;i<HEX.length;i++){const c=HEX[i];if(c===' '){o+=' ';continue;}const ts=t0+i*per+settle;if(t>=ts)o+=c;else if(t<t0+i*per*0.5)o+=' ';else o+='0123456789abcdef'[hash(i*977+Math.floor(t*18)*131)%16];}return o;}

// ---------- timeline ----------
// Every line follows the landing page (bboard-ui/src/i18n/en.ts: hero, "What it's for",
// "How it works"). A record shows you had THIS RECORD by a date, not that you had the
// plant first; every detail is stored locked on VeilCore's server, the name included, and
// the holder's check link carries the name (round 5); genetic data never
// leaves your computer. Don't add a claim here that the landing page doesn't make.
const DUR=60;
const SC=[[0,7.5],[7.5,14.5],[14.5,22.5],[22.5,30],[30,37],[37,45.5],[45.5,53.5],[53.5,60]];
const CAPS=[
 'Many genetics disputes come down to one question: what did you have, and when?',
 'Log a plant. Its proof code is made on your computer.',
 'Only the proof code goes on Midnight, which dates it.',
 'Choose what a checker sees. Your link carries the name; the genetics never go.',
 'Someone checking sends you a link. You tap once.',
 'Their page checks on the network that you control the key this record names.',
 'Send material to a lab with a lab code. The report comes back signed, locked so only you can open it.',
 'Date your record. Keep your genetics.'
];
// Second, smaller line under a caption: [scene, text, seconds after the scene starts].
const NOTES=[
 [0,'Notebooks and files are dated by whoever keeps them, so they’re easy to doubt.',3.0],
 [1,'What you type is stored locked on VeilCore’s server, the name too, and we don’t have the key.',4.9],
 [2,'It goes in a batch with others. The date shows the record existed by then.',3.4],
 [5,'It says nothing about who bred the plant.',3.9],
 [6,'The lab signs with its own key. VeilCore doesn’t vouch for the result.',4.4]
];
const GROUPS=[['g1',0,7.5],['g23',7.5,22.5],['g4',22.5,30],['g56',30,45.5],['g7',45.5,53.5],['g8',53.5,60]];
const LABELS=[['lbLog',7.5,22.5,'Log',C.acc],['lbProve',22.5,45.5,'Prove & check',C.prove],['lbSend',45.5,53.5,'Send & receive',C.send]];

// ---------- build DOM ----------
let html='';
// chrome: section label + brand
LABELS.forEach(([id,,,txt,col])=>{html+=`<div id="${id}" class="abs row" style="left:96px;top:64px;gap:12px"><div style="width:10px;height:10px;border-radius:50%;background:${col}"></div><div class="eyebrow" style="color:${col};font-size:16px">${txt}</div></div>`;});
html+=`<div id="brand" class="abs row" style="right:96px;top:62px;gap:10px"><div style="width:8px;height:8px;border-radius:50%;background:${C.acc}"></div><div class="sg" style="font-weight:600;font-size:17px;letter-spacing:.22em;color:${C.ink2}">VEILCORE</div></div>`;

// ===== G1: many copies =====
const G1={cols:6,rows:3,w:210,h:128,gap:30,x0:255,y0:262,orig:8,tagged:[0,3,4,9,11,13,15,17,6]};
html+='<div id="g1" class="grp">';
for(let r=0;r<G1.rows;r++)for(let c=0;c<G1.cols;c++){
  const i=r*G1.cols+c,x=G1.x0+c*(G1.w+G1.gap),y=G1.y0+r*(G1.h+G1.gap);
  const isO=i===G1.orig;
  html+=`<div id="c1_${i}" class="card" style="left:${x}px;top:${y}px;width:${G1.w}px;height:${G1.h}px;padding:16px 16px;z-index:${isO?5:1}">
   <div class="row" style="gap:10px">${iconTile('sprout',32,C.acc,C.accsoft)}<div class="sg" style="font-weight:600;font-size:18px">Harbour Mist</div></div>
   <div style="font-size:14px;color:${C.ink2};margin-top:12px">HM-7 &middot; cutting</div>
   <div style="margin-top:10px;height:6px;width:76%;border-radius:3px;background:#E9ECE7"></div>
   <div id="t1_${i}" class="pill" style="position:absolute;right:-10px;top:-12px;font-size:13px;padding:4px 10px;background:#FFF;color:${C.ink2};border:1px solid ${C.line}">Since ${2016+hash(i*13+5)%8}</div>
  </div>`;
}
html+='</div>';

// ===== G23: log + fingerprint + Midnight =====
const PX0=600,PY=130,PW=720,PH=620;
html+=`<div id="g23" class="grp">
<svg class="lines">${lineSVG('l3',880,440,1132,440)}</svg>
<div id="panel" class="card" style="left:${PX0}px;top:${PY}px;width:${PW}px;height:${PH}px;background:#FBFCFA">
  <div class="row" style="position:absolute;left:28px;top:24px;gap:10px">${ic('laptop',22,C.ink2)}<div class="eyebrow">Your computer</div></div>
  <div id="rec" class="card" style="left:28px;top:66px;width:664px;height:300px;overflow:hidden;box-shadow:none">
    <div class="row" style="position:absolute;left:28px;top:22px;gap:12px">${iconTile('sprout',36,C.acc,C.accsoft)}<div class="h2" style="font-size:26px">Plant record</div></div>
    ${[['Name','Harbour Mist'],['Parents','HM-3 × Line 7'],['Method','Tissue culture'],['Genetics','']].map(([k,v],i)=>`
    <div id="r2_${i}" class="row" style="position:absolute;left:28px;right:28px;top:${84+i*52}px;height:52px;border-top:1px solid #EEF0EC">
      <div style="width:150px;font-size:17px;color:${C.ink2}">${k}</div>
      ${i<3?`<div id="v2_${i}" style="font-size:21px;font-weight:500" data-full="${v}"></div>
      <div id="srv${i}" class="row" style="position:absolute;right:0;top:15px;gap:7px;font-size:15px;color:${C.ink2}">${ic('lock',17,C.ink2,2)}Locked on VeilCore’s server</div>`:
      `<div id="gen" class="row" style="gap:14px;position:relative"><div id="strip">${markerStrip(24,11)}</div></div>
      <div id="genLock" class="pill" style="white-space:nowrap;position:absolute;right:-6px;top:10px;font-size:15px;padding:5px 12px;background:${C.accsoft};color:${C.acc}">${ic('lock',15,C.acc,2.2)}Your computer only</div>`}
    </div>`).join('')}
    <div id="scan" style="position:absolute;left:0;right:0;top:0;height:46px;background:linear-gradient(180deg,rgba(0,120,90,0) 0%,rgba(0,120,90,.07) 100%);border-bottom:2px solid ${C.acc}"></div>
  </div>
  <div id="fpArrow" style="position:absolute;left:345px;top:372px">${ic('arrowR',30,'#9AA59D',2)}</div>
  <div id="fpBox" style="position:absolute;left:28px;top:410px;width:664px;height:140px;border-radius:12px;background:#fff;border:1px solid ${C.line}">
    <div class="eyebrow" style="position:absolute;left:28px;top:20px">Proof code</div>
    <div class="row" style="position:absolute;left:28px;top:56px;gap:20px">${fpGlyph(54,C.acc,'fr2')}<div id="hex2" class="hex" style="font-size:32px;color:${C.ink}"></div></div>
  </div>
  <div id="stay" class="row" style="position:absolute;left:28px;top:570px;gap:10px">${ic('lock',20,C.acc,2.2)}<div class="sg" style="font-weight:600;font-size:19px;color:${C.acc}">Genetic data never leaves your computer</div></div>
</div>
<div id="mbox" class="card" style="left:1140px;top:190px;width:620px;height:500px">
  <div class="row" style="position:absolute;left:28px;top:26px;gap:14px">${iconTile('ledger',44,C.ink,C.well)}<div><div class="h2">Midnight</div><div class="sub" style="font-size:16px;margin-top:2px">Public network</div></div></div>
  ${['a91c 07be 3d52 … 03fe','5b20 9e14 c7a0 … e7d1'].map((h,i)=>`<div class="row" style="position:absolute;left:28px;top:${112+i*60}px;width:564px;height:48px;border-radius:10px;background:${C.well};padding:0 18px;justify-content:space-between"><div class="row" style="gap:12px">${fpGlyph(24,'#AEB8B0','frx')}<div class="hex" style="font-size:18px;color:#8A948D">${h}</div></div><div style="font-size:15px;color:#8A948D">${i?'13':'11'} Oct 2026</div></div>`).join('')}
  <div id="slot3" class="slot" style="left:28px;top:236px;width:564px;height:76px"></div>
  <div id="date3" class="row" style="position:absolute;left:30px;top:334px;gap:12px">${ic('cal',24,C.acc,2)}<div style="font-size:22px;font-weight:500">Dated 14 Oct 2026, 09:41 UTC</div></div>
  <div id="mfoot" style="position:absolute;left:30px;top:430px;font-size:17px;color:${C.ink2}">A date nobody can backdate.</div>
</div>
<div id="chip3" class="chip row" style="width:564px;height:76px;padding:0 20px;gap:16px;z-index:9">${fpGlyph(40,C.acc,'frc')}<div class="hex" style="font-size:25px">${HEX}</div></div>
</div>`;

// ===== G4: choose what they see =====
const SX=200,SY=160,SW=820;
// Row 0 (the plant name) goes in the holder's check link, after the #; row 3 (genetics) is never shared.
const ROWS4=[['Plant name','In your check link'],['Date','14 Oct 2026'],['Parent names','HM-3 × Line 7'],['Genetics','Marker data']];
html+=`<div id="g4" class="grp">
<svg class="lines">${lineSVG('l4',1028,440,1152,440)}</svg>
<div id="spanel" class="card" style="left:${SX}px;top:${SY}px;width:${SW}px;height:540px">
  <div style="position:absolute;left:36px;top:28px"><div class="h2">Share settings</div><div class="sub" style="margin-top:4px">Harbour Mist</div></div>
  ${ROWS4.map(([a,b],i)=>`<div id="r4_${i}" style="position:absolute;left:0;right:0;top:${112+i*104}px;height:104px;border-top:1px solid #ECEFEA">
