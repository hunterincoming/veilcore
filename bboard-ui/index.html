<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The browser's bar takes the page's Paper (config/theme.ts GROUND). -->
    <meta name="theme-color" content="#F6F3EC" />
    <!-- The headings' face (src/fonts.css), fetched with the page so headings rarely swap. -->
    <link rel="preload" href="/fonts/libre-caslon-text-700.woff2" as="font" type="font/woff2" crossorigin />
    <title>VeilCore — Proof of prior possession</title>
    <!-- The description depends on the build mode: see DESCRIPTION in vite.config.ts. -->
    <meta name="description" content="%VEILCORE_DESCRIPTION%" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VeilCore" />
    <meta property="og:url" content="https://veilcore.org/" />
    <meta property="og:title" content="VeilCore: date your record, keep your genetics." />
    <meta
      property="og:description"
      content="An open record format for plant and animal genetics. Date a record of what you hold without showing anyone the genetics. Free to check, no sign-up."
    />
    <meta property="og:image" content="https://veilcore.org/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="VeilCore. Prove when you had it. Without showing the genetics."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VeilCore: date your record, keep your genetics." />
    <meta
      name="twitter:description"
      content="An open record format for plant and animal genetics. Date a record of what you hold without showing anyone the genetics."
    />
    <meta name="twitter:image" content="https://veilcore.org/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
