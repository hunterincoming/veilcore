# Proof server 8.1.3 (Ledger 8) on purpose: this local chain runs the Ledger 8 node (0.22.3),
# where VeilCore's v1 contracts (compactc 0.31.1) can still be deployed; a proof server serves one
# ledger. Every public network (mainnet, preprod, preview) is on Ledger 9: proof-server-mainnet.yml.
services:
  proof-server:
    image: midnightntwrk/proof-server:8.1.3@sha256:0f4ab0716985eaebbe55a970348f52ff05ffd8a96631ed7232bd0c4ba02c115c
    command: ['midnight-proof-server', '-v']
    container_name: "proof-server-local"
    ports:
      - '127.0.0.1:6300:6300'
