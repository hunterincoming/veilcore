# The proof server the CLI starts for MAINNET (config.ts, MainnetConfig). Mainnet moved to
# Midnight Ledger 9 on 6 November 2026, and a proof server serves one ledger: 9.0.0 here,
# 8.1.3 (proof-server.yml) for the test networks until they fork. Pinned by tag only: add the
# digest from Midnight's signed release manifest (as 8.1.3's was) before relying on it.
services:
  proof-server:
    image: midnightntwrk/proof-server:9.0.0
    command: ['midnight-proof-server', '-v']
    container_name: "proof-server_$TESTCONTAINERS_UID"
    ports:
      - '127.0.0.1:0:6300'
