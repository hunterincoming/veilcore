# The proof server the CLI starts for MAINNET (config.ts, MainnetConfig). Mainnet moved to
# Midnight Ledger 9 on 6 November 2026, and a proof server serves one ledger: 9.0.1 here
# (9.0.0 was never published on Docker Hub), 8.1.3 (proof-server.yml) for the test networks
# until they fork. Pinned by the digest in Midnight's release notes (midnight-ledger, tag
# proof-server-9.0.1), as 8.1.3's was.
services:
  proof-server:
    image: midnightntwrk/proof-server:9.0.1@sha256:90e36a14f92c2004127f0ed1cfd6ee89d770cf1f6e9cd7f02026ffd4ecb42f37
    command: ['midnight-proof-server', '-v']
    container_name: "proof-server_$TESTCONTAINERS_UID"
    ports:
      - '127.0.0.1:0:6300'
