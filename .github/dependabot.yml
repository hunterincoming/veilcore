# Dependabot version updates: weekly, grouped, a few pull requests at a time.
#
# Every Dependabot pull request is reviewed by hand before merge, lockfile included:
# read the package-lock.json diff entry by entry (new packages, changed `resolved` hosts,
# new install scripts) and check it against the release notes. CI must pass. Never merge
# one unread, and never answer one with `npm audit fix`: lockfile changes are made by hand.
#
# Security updates follow the repository's Dependabot security settings, but the `ignore`
# entries below apply to them too: an entry that names only a dependency blocks its security
# pull requests as well. So the Midnight packages get no Dependabot pull requests at all,
# security included. Their alerts still show under Security > Dependabot, and are handled by
# hand, in the reviewed migration described below.

version: 2
updates:
  # One entry covers the root and every workspace (bboard-cli, bboard-ui, api, contract,
  # partner-kit, sponsor): they share the root package-lock.json, and Dependabot updates the
  # workspace package.json files from here. Listing the workspaces again would open
  # duplicate pull requests against the same lockfile.
  #
  # Not covered on purpose: tools/vercel (the deploy CLI, pinned with its own lockfile and
  # changed only in a reviewed commit; see its package.json).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 3
    # Let a release age before it is proposed, so a bad or hijacked version is usually
    # pulled before it reaches us.
    cooldown:
      default-days: 14
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
      runtime:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # Midnight packages are never updated here. The compiled contracts in contract/ are
      # generated by the pinned Compact compiler (0.31.1, see ci.yaml) against one
      # compact-runtime and ledger version, and their keys and ZKIR are fingerprinted in
      # docs/fingerprints.md against the mainnet deploy. A new compact-runtime, ledger,
      # onchain-runtime or midnight-js can require recompiling the contracts, which this
      # repository does not do. These packages move together, by hand, in a reviewed
      # migration (as with ledger 9: docs/log/ledger-9-lockfile.md).
      - dependency-name: "@midnight-ntwrk/*"
      - dependency-name: "@midnightntwrk/*"

  # Workflow actions are pinned by commit SHA with the version in a comment; Dependabot
  # updates both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 2
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
