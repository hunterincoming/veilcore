name: PR description

# The coding tool that opens our PRs adds a "Generated by Claude Code" line to every PR
# description, and adds it back whenever it edits one. Nothing we send from there can keep it
# off, so this removes it on GitHub's side: on every PR opened or edited, and, when run by
# hand, on every PR in the repo (open and closed).

on:
  pull_request:
    types: [opened, edited, reopened]
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: pr-description-${{ github.event.pull_request.number || 'all' }}

jobs:
  remove-line:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Remove the generated-by line
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${PR:-}" ]; then
            numbers="$PR"
          else
            numbers=$(gh api --paginate "repos/$REPO/pulls?state=all&per_page=100" --jq '.[].number')
          fi
          for n in $numbers; do
            gh api "repos/$REPO/pulls/$n" --jq '.body // ""' > body.txt
            python3 - <<'PY'
          import re
          s = open('body.txt', encoding='utf-8').read()
          out = re.sub(r'(\n\s*-{3,}\s*)?\n[^\n]*Generated (with|by) \[Claude Code\]\([^)]*\)[^\n]*', '', s)
          out = re.sub(r'\n[^\n]*https://claude\.ai/code/session_[^\s)]*[^\n]*', '', out)
          open('changed.txt', 'w').write('1' if out != s else '0')
          open('body.txt', 'w', encoding='utf-8').write(out.rstrip() + '\n')
          PY
            if [ "$(cat changed.txt)" = "1" ]; then
              gh api -X PATCH "repos/$REPO/pulls/$n" -F body=@body.txt > /dev/null
              echo "Cleaned #$n"
            fi
          done
