name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

# The same tests as before, in jobs that run side by side:
#
#   contract ──┬── packages       (contract tests, api, partner kit, VeilCore-run, CLI, sponsor, scripts)
#              ├── contract-v2    (contract v2 on its own compiler, 0.36.1; docs/contract-v2.md)
#              ├── site-unit      (site typecheck, lint, unit tests and the built site under production headers)
#              └── site-browser   (the browser tests, in 6 shards)
#                        └── install-and-test   (passes only when every job above passed)
#
# The contract is compiled once, with its keys, and handed to the other jobs. `install-and-test`
# is the check the "protect main" ruleset requires and scripts/deploy-gate.mjs reads: keep that
# job's name. Every job starts from .github/actions/setup (compiler, Node, npm, npm ci).

jobs:
  contract:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        with:
          persist-credentials: false

      - name: Set up (compiler, Node, npm, npm ci)
        uses: ./.github/actions/setup

      # Advisories in anything that ships (the site bundle, the CLI, the contract package).
      # Dev-only tooling is left out so a test-runner advisory doesn't block a release.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Compile the contract, with keys
        working-directory: contract
        run: |
          npm run compact

      - name: Hand the compiled contract to the other jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  #v7.0.2
        with:
          name: compiled-contract
          path: contract/src/managed
          if-no-files-found: error
          retention-days: 1

  packages:
    needs: contract
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        with:
          persist-credentials: false

      - name: Set up (compiler, Node, npm, npm ci)
        uses: ./.github/actions/setup

      - name: The compiled contract
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  #v8.0.2
        with:
          name: compiled-contract
          path: contract/src/managed

      # The rest of the contract's `npm run ci`, after the compile the contract job did.
      - name: Test contract
        working-directory: contract
        run: |
          npm run typecheck
          npm run lint
          npm run build
          npm run test

      - name: api
        working-directory: api
        run: |
          npm run ci

      - name: Partner kit (@veilcore/contracts)
        working-directory: partner-kit
        run: |
          npm run ci

      - name: VeilCore-run (managed service)
        run: |
          npm run managed:check

      - name: Compile bboard-cli
        working-directory: bboard-cli
        run: |
          npm run ci

      # The 2-of-3 maintenance committee (docs/maintenance-committee.md): the signing and
      # request scripts, then the launcher against the ledger's own code. Nothing is sent.
      # The test file is named: `node --test scripts/committee` fails on Node 22.
      - name: Maintenance committee scripts
        run: |
          node --test scripts/committee/committee.test.mjs

      # The deploy scripts' refusals (a test site with claims but no claims keys, a mainnet
      # build with a leftover indexer, a deploy from a commit CI has not passed). Nothing is deployed.
      - name: Deploy script checks
        run: |
          node --test scripts/deploy-gate.test.mjs scripts/deploy-test-site.test.mjs scripts/deploy-mainnet.test.mjs scripts/contracts-package.test.mjs

      # The fee sponsor and its indexer relay (sponsor/): the code veilcore.org's sends go
      # through. Nothing is sent; the network is stood in for.
      - name: Sponsor
        run: |
          npm run typecheck -w sponsor
          npm test -w sponsor

      # The other script checks: file names that collide on a case-insensitive disk, the
      # release list, and the Bitcoin stamp check. Nothing is deployed or sent.
      - name: Other script checks
        run: |
          node --test scripts/case-collisions.test.mjs scripts/release-manifest.test.mjs scripts/check-bitcoin-stamp.test.mjs scripts/btc-checkpoints.test.mjs

      # The Ledger 9 client stack: no midnight-js maintenance helper on the v1 contracts outside
      # the guarded places, one version of Ledger 9, every proof server pinned by digest.
      - name: Ledger 9 client stack
        run: |
          node --experimental-strip-types --no-warnings --import ./api/test-ts-resolve.mjs --test scripts/ledger9-client.test.mjs

      # deployments/*.json against docs/fingerprints.md, the README, the deploy guard, the release
      # list and the pinned compiler; then the deployment check against a stand-in indexer
      # (docs/reproduce-build.md). Nothing is read from a real network.
      - name: Deployments file and deployment check
        run: |
          npm run test:deployments

      # The committee launcher (with the mainnet gate and the key slot), the contract v2 deploy
      # command and the v2 smoke run's refusals, each against the ledger's own code. Nothing is
      # sent. (The smoke run's end-to-end test needs contract v2 compiled: the contract-v2 job.)
      - name: Maintenance committee launcher, and the contract v2 deploy and smoke commands
        working-directory: bboard-cli
        run: |
          npx vitest run src/launcher/committee.test.ts src/launcher/deploy-v2.test.ts src/launcher/smoke-v2.test.ts

      # The same three tools, run the way the Mac runs them (Node's own loader, not a bundler), with
      # no arguments: each must load all its code and stop at its usage message. Nothing is sent.
      - name: The v2 deploy tools load under Node's own loader
        run: |
          node scripts/check-cli-loads.mjs

  site-unit:
    needs: contract
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        with:
          persist-credentials: false

      - name: Set up (compiler, Node, npm, npm ci)
        uses: ./.github/actions/setup

      - name: The compiled contract
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  #v8.0.2
        with:
          name: compiled-contract
          path: contract/src/managed

      - name: Compile bboard-ui
        run: |
          npm run build -w @veilcore/contract
          npm run ci -w @veilcore/ui

      # The unit tests include the built site under the production headers
      # (src/hardening-roundD.test.ts), so build it first, against the address those tests
      # stand in for. Nothing is deployed from here.
      - name: Site unit tests, and the built site under production headers
        working-directory: bboard-ui
        run: |
          VITE_API_BASE=https://veilcore-api-production.up.railway.app npm run build
          npm run e2e:setup -- --with-deps
          npm test

  # The built site in a real browser at phone size, with a stand-in registry and every
  # other network request refused (bboard-ui/e2e/README.md). Catches what only breaks
  # in a browser: bundling, storage, the chain code loading, pages that come up blank.
  # Split by test file into 6 shards; together they run every test, as one run did.
  site-browser:
    needs: contract
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        with:
          persist-credentials: false

      - name: Set up (compiler, Node, npm, npm ci)
        uses: ./.github/actions/setup

      - name: The compiled contract
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  #v8.0.2
        with:
          name: compiled-contract
          path: contract/src/managed

      - name: Site in a browser (shard ${{ matrix.shard }} of 6)
        working-directory: bboard-ui
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          npm run build -w @veilcore/contract
          npm run e2e:setup -- --with-deps
          npm run e2e:build
          npm run e2e -- --shard="$SHARD/6"

      # A browser test that fails only here: print what the page showed (Playwright's text
      # snapshot of it), so the cause can be read from the log.
      - name: What the page showed, for a failed browser test
        if: failure()
        working-directory: bboard-ui
        run: |
          find test-results -name error-context.md -print -exec cat {} \; 2>/dev/null | head -400 || true

  # The required check. It runs even when a job above failed or was skipped, and passes only
  # when every one of them passed (a skipped required check would otherwise count as passing).
  # Contract v2 (contract-v2/, docs/contract-v2.md): its own compiler, 0.36.1, never on the
  # PATH, so nothing else here can use it by mistake; v1 keeps 0.31.1 from the setup step.
  # Compiled without keys (keys are built only on the maintainer's Mac). v1's compiled
  # contract is downloaded so v2's pure circuits are compared with v1's live, not only with
  # the recorded fixture.
  contract-v2:
    needs: contract
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        with:
          persist-credentials: false

      - name: Set up (compiler, Node, npm, npm ci)
        uses: ./.github/actions/setup

      # The same rule as the setup step: a fixed release asset checked against a recorded
      # SHA-256 (contract-v2/compiler-checksums.txt), and no fallback.
      - name: Install Compact compiler 0.36.1 for contract v2 (pinned, checksummed)
        shell: bash
        env:
          COMPACTC_VERSION: "0.36.1"
          COMPACTC_SHA256: "9d5fedfec9ae775a1e47d5c6f785130b314c1c5c52cd1a4eb9fc56d1fc61d23a"
        run: |
          set -euo pipefail
          dir=/opt/compactc-v2
          zip="$RUNNER_TEMP/compactc-v2.zip"
          curl -fsSL --retry 3 -o "$zip" \
            "https://github.com/midnightntwrk/compact/releases/download/compactc-v${COMPACTC_VERSION}/compactc_v${COMPACTC_VERSION}_x86_64-unknown-linux-musl.zip"
          echo "${COMPACTC_SHA256}  ${zip}" | sha256sum -c -
          grep -q "^${COMPACTC_SHA256}  compactc_v${COMPACTC_VERSION}_x86_64-unknown-linux-musl.zip$" contract-v2/compiler-checksums.txt
          sudo mkdir -p "$dir"
          sudo unzip -q "$zip" -d "$dir"
          test "$("$dir/compactc" --version | cut -d' ' -f1)" = "$COMPACTC_VERSION"
          # v1's compiler is untouched.
          test "$(compact compile --version)" = "0.31.1"

      - name: v1's compiled contract
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  #v8.0.2
        with:
          name: compiled-contract
          path: contract/src/managed

      - name: Contract v2 (compile without keys, typecheck, lint, test)
        working-directory: contract-v2
        env:
          COMPACTC: /opt/compactc-v2/compactc
        run: |
          npm run ci

      # The v2 deploy, verify:deployment --v2-record and the committee gate, against the ledger's
      # own code and the compiled v2 constructor (scripts/v2/v2.test.mjs). Nothing is sent.
      - name: Contract v2 deploy, deployment check and gate
        run: |
          node --test scripts/v2/v2.test.mjs

      # The v2 smoke run end to end: v2 deployed on the ledger's own code by the deploy command,
      # then found through midnight-js and its first call built and handed to the prover. The
      # plan itself (every circuit, through midnight-js offline) runs in `npm run ci` above.
      - name: Contract v2 smoke run (deploy, find, first call)
        working-directory: bboard-cli
        run: |
          npx vitest run src/launcher/smoke-v2.test.ts

  install-and-test:
    if: always()
    needs: [contract, packages, contract-v2, site-unit, site-browser]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'to_entries | length == 5 and all(.value.result == "success")' > /dev/null
